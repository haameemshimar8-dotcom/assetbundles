# This is a Declarative Automation Bundle definition for dabproject.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: dabproject
  uuid: 935d8397-cb4f-4250-a219-e681b571638c

include:
  - resources/*.yml
  - resources/*/*.yml
  - resources/*/*/*.yml    # <-- add this to reach resources/jobs/variables/variables.yml


# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    presets:
      name_prefix: dev_${workspace.current_user.short_name}
      source_linked_deployment: false
    workspace:
      host: https://dbc-f609802d-5a28.cloud.databricks.com/
    variables:
      catalog: workspace
      schema: dev
  prod:
    mode: production
    workspace:
      host: https://dbc-f609802d-5a28.cloud.databricks.com/
      # We explicitly deploy to /Workspace/Users/haameemshimar8@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/haameemshimar8@gmail.com/PROD/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: prod
    permissions:
      - group_name: admins
        level: CAN_MANAGE
